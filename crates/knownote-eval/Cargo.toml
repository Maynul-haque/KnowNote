[package]
name = "knownote-eval"
description = "The retrieval evaluation harness for KnowNote: the reference point every retrieval change is measured against."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
knownote-core = { path = "../knownote-core" }
knownote-embed = { path = "../knownote-embed" }
knownote-embedding = { path = "../knownote-embedding" }
knownote-ingest = { path = "../knownote-ingest" }
knownote-store = { path = "../knownote-store" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "knownote-eval"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
