name: Probe ORT build

# Scratch workflow: on one runner, produce the reference baseline with the real
# TypeScript pipeline, then ask the Rust port to reproduce it. If both drift the
# same way with the CPU's ISA, parity is a same-hardware property and the gate
# must compare against the reference rather than a committed file.
#
# Delete this file and branch once the question is answered.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Machine identity
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512f|avx512_vnni|amx)' | tr '\n' ' '
          echo

      - name: Cache the reference model
        uses: actions/cache@v4
        with:
          path: ~/.config/knownote/models
          key: knownote-eval-model-${{ hashFiles('src/main/embedding/localModel.ts') }}

      - name: Build the app
        run: npm run build

      - name: Produce the reference baseline on this machine
        run: |
          xvfb-run -a node scripts/eval.mjs --prepare
          xvfb-run -a node scripts/eval.mjs
          node -e "const b=require('./docs/eval/baseline-v1.6.json');console.log('reference recallAt1', b.metrics.recallAt1)"

      - name: Download the pinned model for the Rust port
        run: |
          cargo run -p knownote-embed --example download_model -- .knownote-models
          test -f .knownote-models/Xenova/multilingual-e5-small/761b726dd34fb83930e26aab4e9ac3899aa1fa78/onnx/model_quantized.onnx

      - name: Fetch ONNX Runtime and PDFium
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz
          tar -xzf /tmp/ort.tgz -C /tmp
          ORT_LIB="$(find /tmp/onnxruntime-linux-x64-1.30.0 -name 'libonnxruntime.so' -print -quit)"
          test -n "$ORT_LIB"
          echo "KNOWNOTE_ONNXRUNTIME=$ORT_LIB" >> "$GITHUB_ENV"

          curl -fsSL -o /tmp/pdfium.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-linux-x64.tgz
          mkdir -p /tmp/pdfium
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium
          PDFIUM_LIB="$(find /tmp/pdfium -name 'libpdfium.so' -print -quit)"
          test -n "$PDFIUM_LIB"
          echo "KNOWNOTE_PDFIUM=$(dirname "$PDFIUM_LIB")" >> "$GITHUB_ENV"

      - name: Rust must reproduce the reference on the same machine
        env:
          KNOWNOTE_EVAL_MODEL_CACHE: ${{ github.workspace }}/.knownote-models
        run: |
          git --no-pager diff --stat docs/eval/baseline-v1.6.json
          node -e "const b=require('./docs/eval/baseline-v1.6.json');console.log('reference recallAt1', b.metrics.recallAt1)"
          cargo test --workspace --locked -- --ignored --nocapture
