name: Verify

# Pull-request gate. `release.yml` is tag-triggered and only proves that
# installers can be produced, which is not the same as proving the app can start:
# three separate startup crashes in this repo (a hoisted `script-loader!sql.js`
# require, a module-scope `new DOMMatrix()` in bundled pdfjs, and
# `AnkiExport is not a constructor` from a lost CJS interop) all packaged cleanly.
#
# `npm run smoke:packaged` launches the real packaged executable and self-checks
# it, so it is the step that actually catches those. It runs on all three
# platforms because the native addons are arch-specific:
#
#   better-sqlite3 (prebuilds/<platform>-<arch>.node), vec0.so/.dylib/.dll, skia.*.node
#
# `lint` is deliberately not part of this gate: it reports no errors but still
# carries a large pre-existing `@typescript-eslint/no-explicit-any` baseline,
# unrelated to build correctness.

on:
  pull_request:
  workflow_dispatch:

# Verification only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # Report every platform's result instead of stopping at the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # check:version compares package.json against the newest release tag, so the
          # tags have to be here. `fetch-tags: true` does NOT do it: in the shallow
          # path actions/checkout only adds the checked-out ref's own tag to the
          # refspec, and a pull request ref (`refs/pull/N/merge`) has no tag. All tags
          # come with all history, and this repository is small enough that the full
          # fetch is not worth optimising.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Deliberately before `npm ci`: it reads only package.json and the git tags,
      # so a version that has fallen behind the newest release fails in seconds
      # instead of after a full install.
      - name: Version consistency
        run: npm run check:version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Cheap and platform-independent: enforces DESIGN.md's mechanically
      # checkable rules (radius, elevation, colours, text levels) before the
      # long packaging step below does any work.
      - name: Design tokens
        run: npm run check:design

      - name: Unit tests
        run: npm test

      # Runs `npm run build` first, then electron-builder --dir, so the bundle and
      # the package are both covered by this one step.
      - name: Build and package (unpacked)
        run: npm run build:unpack
        env:
          # No signing material in CI; don't let electron-builder go looking for
          # an identity on macOS or a certificate on Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The packaged app needs a display; GitHub's Linux runners are headless.
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:packaged

      - name: Smoke test the packaged app (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run smoke:packaged

      # The eval baseline (#75) is the reference point every experiment is
      # measured against, so CI proves the committed numbers still reproduce. The
      # model cache is keyed on the pinned model file, so the 134 MB download
      # happens once per pin, not once per run. A hit is required for the run to
      # be offline: `eval:prepare` only downloads when the cache is cold.
      - name: Cache eval embedding model
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.config/knownote/models
          key: knownote-eval-model-${{ hashFiles('src/main/embedding/localModel.ts') }}

      - name: Eval harness is deterministic
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run eval:prepare
          xvfb-run -a node scripts/eval.mjs
          cp docs/eval/baseline-v1.6.json /tmp/eval-a.json
          xvfb-run -a node scripts/eval.mjs
          diff /tmp/eval-a.json docs/eval/baseline-v1.6.json

  # Every other job in this file builds the Electron app. Without this one the
  # Rust rewrite was only ever tested on the machine that wrote it: the chunker,
  # the tiered store and the loaders had no CI gate at all. The always-on suite
  # needs no embedding model and no Pdfium - the gates that do are `#[ignore]`d
  # and stay with the machine that holds those artifacts.
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Keyed on Cargo.lock and the toolchain, so a dependency change recompiles
      # and a source-only change does not. rusqlite's bundled SQLite and the
      # tokenizers native build are the slow part.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test the workspace
        run: cargo test --workspace --locked

  # The always-on suite above skips the two gates that carry the "same product"
  # claim: the retrieval baseline needs the pinned model and an ONNX Runtime, and
  # the PDF loader pin needs PDFium. Both are `#[ignore]`d rather than failed
  # when the artifacts are absent, so a green `rust` job alone proves neither.
  #
  # This job does not compare the port against the committed baseline directly,
  # because embeddings are a property of the machine as well as the code: ONNX
  # Runtime picks CPU kernels from the host's ISA, and two runners in the same
  # fleet gave recallAt1 0.59434 (no AVX-512) and 0.580189 (Xeon 8573C, with
  # AVX-512) from the same weights and the same runtime build. So the real
  # TypeScript pipeline runs first, rewriting docs/eval/baseline-v1.6.json with
  # that machine's own reference, and the Rust port must then reproduce it
  # exactly. That is the claim worth gating: the port is faithful on whatever
  # hardware the gate lands on. The committed file remains the Windows reference.
  #
  # The model caches are keyed on the files that pin the revision and hashes, so
  # a model upgrade misses both caches instead of silently reusing old weights.
  # ONNX Runtime and PDFium are fetched each run (~50 MB) because they are
  # pinned here, not in a lock file.
  rust-gates:
    name: rust-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache the reference model
        uses: actions/cache@v4
        with:
          path: ~/.config/knownote/models
          key: knownote-eval-model-${{ hashFiles('src/main/embedding/localModel.ts') }}

      - name: Build the app
        run: npm run build

      # The harness runs through the real Electron main process, so it needs a
      # display even when only preparing the model. A cache hit makes --prepare
      # a no-op; a cold run downloads the pinned weights once per pin.
      - name: Produce the reference baseline on this runner
        run: |
          xvfb-run -a node scripts/eval.mjs --prepare
          xvfb-run -a node scripts/eval.mjs
          node -e "const b=require('./docs/eval/baseline-v1.6.json');console.log('reference recallAt1', b.metrics.recallAt1)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache the pinned embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.knownote-models
          key: knownote-rust-model-${{ hashFiles('crates/knownote-embed/src/local_model.rs') }}

      # The downloader verifies every file against the committed manifest, so a
      # partial or corrupt cache fails here instead of inside the eval. The
      # explicit file check is deliberate: the baseline test *skips* (and passes)
      # when the model is absent, and a green skip is not a proof.
      - name: Download the pinned embedding model
        run: |
          cargo run -p knownote-embed --example download_model -- .knownote-models
          test -f .knownote-models/Xenova/multilingual-e5-small/761b726dd34fb83930e26aab4e9ac3899aa1fa78/onnx/model_quantized.onnx

      # ONNX Runtime 1.30.0 is the version the Electron app ships. The PDFium
      # build is pinned to `chromium/7881`, the FPDF surface pdfium-render's
      # `pdfium_7881` feature was generated from - another build is not a safe
      # substitution. Both libraries are located with `find` so the tarball
      # layout is not assumed.
      - name: Download ONNX Runtime and PDFium
        run: |
          set -euo pipefail

          curl -fsSL -o /tmp/onnxruntime.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz
          tar -xzf /tmp/onnxruntime.tgz -C /tmp
          ORT_LIB="$(find /tmp/onnxruntime-linux-x64-1.30.0 -name 'libonnxruntime.so' -print -quit)"
          test -n "$ORT_LIB"
          echo "KNOWNOTE_ONNXRUNTIME=$ORT_LIB" >> "$GITHUB_ENV"

          curl -fsSL -o /tmp/pdfium.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-linux-x64.tgz
          mkdir -p /tmp/pdfium
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium
          PDFIUM_LIB="$(find /tmp/pdfium -name 'libpdfium.so' -print -quit)"
          test -n "$PDFIUM_LIB"
          # The loader joins the platform library name to this directory.
          echo "KNOWNOTE_PDFIUM=$(dirname "$PDFIUM_LIB")" >> "$GITHUB_ENV"

      - name: Run the artifact-gated tests
        env:
          KNOWNOTE_EVAL_MODEL_CACHE: ${{ github.workspace }}/.knownote-models
        run: cargo test --workspace --locked -- --ignored

  # The artifact users actually download on Linux is the AppImage, not the
  # unpacked build - and the one code path that differs between the two is the
  # embedding worker thread, whose entry inside app.asar once turned every model
  # lookup into `Not Found` while the unpacked smoke test stayed green
  # (docs/appimage-embedding-indexing-bug.md). This job runs the smoke test
  # against the AppImage itself - --appimage-extract + AppRun, so no FUSE - with
  # the pinned model provisioned into a throwaway profile, so the worker-thread
  # embedding check runs against the packaged artifact for real.
  #
  # It is also the dispatch target for iterating on packaging changes without
  # touching a release: `gh workflow run verify.yml --ref <branch>`.
  smoke-appimage:
    name: smoke-appimage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Version consistency
        run: npm run check:version

      - name: Install dependencies
        run: npm ci

      # Same cache as the `verify` job fills on its Linux leg: a hit makes the
      # prime step a no-op, so the 134 MB download happens once per pin.
      - name: Cache eval embedding model
        uses: actions/cache@v4
        with:
          path: ~/.config/knownote/models
          key: knownote-eval-model-${{ hashFiles('src/main/embedding/localModel.ts') }}

      # electron-builder's AppImage tooling needs libfuse2, and icon detection
      # needs `file`. Both are present on the runner image, but neither is
      # guaranteed to stay there, and a missing one fails late and obscurely.
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      # Covers typecheck + electron-vite; the unit tests are deliberately left
      # to the `verify` job to keep this packaging gate from growing.
      - name: Build
        run: npm run build

      # Fills the cache above on a cold run. `--eval-prepare` only downloads the
      # pinned model; it never opens the database. The eval entry still runs the
      # real Electron main process, so it needs a display even for that.
      - name: Prime the pinned embedding model cache
        run: xvfb-run -a node scripts/eval.mjs --prepare

      - name: Package the AppImage
        run: npx electron-builder --linux AppImage --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test the AppImage artifact
        run: xvfb-run -a npm run smoke:appimage
        env:
          SMOKE_MODEL_CACHE: ~/.config/knownote/models
