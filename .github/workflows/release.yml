name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Where the artifacts are published.
#
# electron-builder's configuration names the upstream repository, which is right
# there and wrong in a fork: the build succeeded and the *upload* failed with a
# 403, because the token has no write access to somebody else's repository.
#
# These two variables are the repository the workflow is actually running in, so
# the same workflow publishes to the fork in a fork and to upstream in upstream.
# The electron-builder configuration keeps the upstream name as its default for
# a local build with no override.
#
# They are read as `${{ env.PUBLISH_OWNER }}` and not as `$PUBLISH_OWNER`: the
# Windows runner uses PowerShell, where a bare `$NAME` is a PowerShell variable
# rather than an environment variable, and it is not set. The Linux runner uses
# bash, where the bare form works - so the bare form fails on exactly one
# platform, which is the hardest kind of failure to notice.
env:
  PUBLISH_OWNER: ${{ github.repository_owner }}
  PUBLISH_REPO: ${{ github.event.repository.name }}

# Least privilege: the jobs only need to create/upload/edit GitHub releases.
permissions:
  contents: write

jobs:
  # The tag names the release and package.json is what electron-builder stamps
  # into every artifact name and into the updater feed, so a mismatch publishes a
  # build that disagrees with its own tag. Gating here means a bad tag fails
  # before `create-draft` runs, so it leaves no orphan draft behind either.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # GITHUB_REF/GITHUB_REF_NAME identify the pushed tag, so this needs no tag
      # lookup and no full history; it reads package.json and nothing else.
      - name: Tag matches package.json
        run: npm run check:version

  # Creates the release as a draft BEFORE the platform builds, so both matrix
  # jobs upload into the same release. Without this, macos and windows run
  # concurrently, each finds no release for the tag and each creates its own
  # draft: the v1.2.2 attempt produced two releases both tagged v1.2.2, with the
  # assets split between them (the .dmg in one, latest.yml in the other), so
  # promoting either one would have published an incomplete release with a
  # broken update feed.
  #
  # Drafts left over for this tag are deleted first: a draft is never visible to
  # users and can only be the remains of an earlier failed attempt, so mixing
  # its stale assets into a fresh run is worse than rebuilding the release
  # empty. Re-running a failed release run therefore starts from a clean slate.
  create-draft:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" \
          | while IFS= read -r id; do
            echo "deleting stale draft release $id for $TAG"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" \
            --notes "Release notes are generated when this draft is promoted."

  release:
    needs: create-draft
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every platform's result instead of stopping at the first failure.
      # macOS and Windows upload into the same draft release, so cancelling one
      # because the other failed would leave the draft carrying only half the
      # assets. The draft is promoted only when every job in this matrix
      # succeeded, so this does not weaken the publish gate.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Caches the npm download cache (not node_modules). Requires the
          # committed package-lock.json, which `npm ci` verifies against.
          cache: 'npm'

      # npm, not pnpm, is deliberate: electron-builder's node-module collector is
      # built around npm's node_modules layout and silently dropped transitive
      # production dependencies under pnpm's virtual store. When the collector
      # does miss something, `allowMissingDependencies: false` in
      # electron-builder.yml now fails the build rather than shipping a broken
      # app. See .npmrc and the `//dependencies` note in package.json.
      - name: Install dependencies
        run: npm ci

      # Fail BEFORE anything is published if the entitlement that lets us load
      # third-party native modules is missing from the plist.
      - name: Verify macOS entitlements (pre-build gate)
        if: matrix.os == 'macos-latest'
        run: |
          python3 - <<'PY'
          import plistlib, sys

          path = 'build/entitlements.mac.plist'
          try:
              ents = plistlib.load(open(path, 'rb'))
          except Exception as exc:
              print(f'::error::{path} is not a readable plist: {exc}')
              sys.exit(1)

          # keep-sorted start
          required = [
              'com.apple.security.cs.allow-jit',
              'com.apple.security.cs.allow-unsigned-executable-memory',
              'com.apple.security.cs.disable-library-validation',
          ]
          # keep-sorted end

          missing = [k for k in required if ents.get(k) is not True]
          if missing:
              print('::error::' + path + ' is missing required entitlements: ' + ', '.join(missing))
              print('::error::Without disable-library-validation the app crashes at launch')
              print('::error::with "mapping process and mapped file have different Team IDs".')
              sys.exit(1)

          print('OK - entitlements present:', ', '.join(sorted(ents)))
          PY

      - name: Build application
        run: npm run build

      # macOS 代码签名（可选）
      - name: Import Code Signing Certificate (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$CERTIFICATE_P12" ]; then
            echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
            security create-keychain -p actions build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p actions build.keychain
            security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
            security find-identity -v -p codesigning build.keychain
          else
            echo "::warning title=No Developer ID certificate::MACOS_CERTIFICATE is empty, so this build will be AD-HOC SIGNED and NOT notarized. It will not launch on other people's Macs until users run: sudo xattr -rd com.apple.quarantine /Applications/KnowNote.app"
          fi

      # Windows 代码签名（可选）
      - name: Code Sign (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERTIFICATE) {
            echo "Windows 代码签名已配置"
          }

      # 构建和发布
      # --arm64 is explicit so the produced architecture does not silently depend
      # on whatever CPU the macos-latest runner happens to have.
      # electron-builder is called directly rather than through
      # `npm run build:mac`, because the publish target has to be overridden
      # and the npm script cannot pass that through. The `npm run build` half of
      # that script is the "Build application" step above, which this job has
      # already run.
      - name: Build & Release (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          npx electron-builder --mac --arm64
          --config.publish.owner="${{ env.PUBLISH_OWNER }}"
          --config.publish.repo="${{ env.PUBLISH_REPO }}"
          --publish always

      # Inspect the artifact we just shipped. This is the check that was missing
      # when v1.2.0 went out ad-hoc signed, hardened-runtime, and unable to load
      # its native module.
      - name: Verify macOS artifact (signature, entitlements, native modules)
        if: matrix.os == 'macos-latest'
        run: |
          set -uo pipefail

          APP=$(find dist -maxdepth 2 -type d -name 'KnowNote.app' | head -n1)
          if [ -z "$APP" ]; then
            echo "::error::no KnowNote.app was produced under dist/"
            exit 1
          fi
          echo "Artifact: $APP"

          echo "--- main binary signature ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Identifier|TeamIdentifier|Signature|flags' || true

          TEAM=$(codesign -dv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          case "$TEAM" in
            ''|'not set')
              IS_ADHOC=1
              echo "::warning title=Unsigned macOS build::No Developer ID TeamIdentifier. Users must run: sudo xattr -rd com.apple.quarantine /Applications/KnowNote.app (see the Install section of README.md)"
              ;;
            *)
              IS_ADHOC=0
              echo "Developer ID TeamIdentifier: $TEAM"
              ;;
          esac

          echo "--- entitlements actually embedded in the shipped binary ---"
          ENT=$(mktemp)
          codesign -d --entitlements :- "$APP" > "$ENT" 2>/dev/null || true
          cat "$ENT"
          # An unsigned bundle embeds no entitlements, and that is the expected
          # state while the pipeline has no Developer ID certificate: see the
          # Install section of README.md for the user-side workaround. It is only
          # tolerable without an identity though - once a certificate is present,
          # missing entitlements mean the v1.2.0 crash is back and the release
          # must not go out.
          if grep -q 'disable-library-validation' "$ENT"; then
            echo "entitlements: disable-library-validation is present"
          elif [ "$IS_ADHOC" -eq 1 ]; then
            echo "::warning title=Unsigned macOS build::No identity was available, so the bundle carries no entitlements. This build is not notarized and cannot be launched on Apple Silicon until the user clears the quarantine flag; README.md documents the command."
          else
            echo "::error::shipped app is missing com.apple.security.cs.disable-library-validation."
            echo "::error::It will crash on launch when the main process loads better-sqlite3's native module."
            exit 1
          fi

          echo "--- native modules unpacked from the asar ---"
          NATIVES=$(find "$APP/Contents/Resources/app.asar.unpacked" -type f \( -name '*.node' -o -name '*.dylib' \) 2>/dev/null)
          if [ -z "$NATIVES" ]; then
            echo "::error::no native modules found in app.asar.unpacked - asarUnpack is broken"
            exit 1
          fi
          echo "$NATIVES" | while IFS= read -r f; do
            printf '%s\n    -> ' "$f"
            codesign -dv "$f" 2>&1 | grep -E 'TeamIdentifier|Signature' | tr '\n' ' ' || echo -n 'NO SIGNATURE'
            echo
          done

          # better-sqlite3 >= 13 is N-API and ships its binary as
          # `prebuilds/<platform>-<arch>.node`, not the old
          # `build/Release/better_sqlite3.node`, and nothing rebuilds it.
          if ! echo "$NATIVES" | grep -qE 'better-sqlite3/prebuilds/.+\.node'; then
            echo "::error::a better-sqlite3 prebuild was not unpacked; the database will fail to open"
            exit 1
          fi

          echo "--- consistency ---"
          VERIFY_FAILED=0
          codesign --verify --strict --verbose=2 "$APP" || VERIFY_FAILED=1
          echo "$NATIVES" | while IFS= read -r f; do
            codesign --verify --strict "$f" || echo "::warning::$f failed signature verification"
          done

          if [ "$VERIFY_FAILED" -eq 1 ]; then
            if [ "$IS_ADHOC" -eq 0 ]; then
              echo "::error::codesign --verify failed on a Developer ID signed bundle."
              echo "::error::This build would be rejected on user machines."
              exit 1
            fi
            echo "::warning title=Unsigned macOS build::codesign --verify --strict failed, which is expected without an identity. The app launches only after the user clears the quarantine flag; inspect the log above before publishing."
          else
            echo "signature verify: OK"
          fi

          if [ "$IS_ADHOC" -eq 1 ]; then
            echo "::notice title=macOS artifact verified::$(echo "$NATIVES" | wc -l | tr -d ' ') native module(s) unpacked; bundle is unsigned."
          else
            echo "::notice title=macOS artifact verified::entitlements present, $(echo "$NATIVES" | wc -l | tr -d ' ') native module(s) unpacked and signed."
          fi

      - name: Build & Release (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --win
          --config.publish.owner="${{ env.PUBLISH_OWNER }}"
          --config.publish.repo="${{ env.PUBLISH_REPO }}"
          --publish always

  # Linux is built and published in its own job rather than as a third entry in
  # the matrix above, because the `publish` job promotes the draft only when
  # every platform it depends on succeeded. A Linux-only failure - a missing
  # distro package, a packaging tool that changed behaviour - must not hold the
  # Windows and macOS users hostage while they wait on the release.
  #
  # The job still reports failure, so a broken Linux build is visible in this
  # workflow run and named in the release notes; it just does not block
  # publication. When it fails, no Linux artifact is uploaded at all:
  # electron-builder uploads only after a successful build, so the published
  # draft is never left half-populated with Linux files.
  release-linux:
    needs: create-draft
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The AppImage gate runs the worker-thread embedding check against the
      # pinned model, so the cache that `verify.yml` fills on pull requests
      # covers the release too: a hit makes the prime step below a no-op, and
      # the 134 MB download happens once per pin, not once per run.
      - name: Cache eval embedding model
        uses: actions/cache@v4
        with:
          path: ~/.config/knownote/models
          key: knownote-eval-model-${{ hashFiles('src/main/embedding/localModel.ts') }}

      # electron-builder's AppImage tooling needs libfuse2, and icon detection
      # needs `file`. Both are present on the runner image, but neither is
      # guaranteed to stay there, and a missing one fails late and obscurely.
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      # The unpacked build is the same artifact the macOS and Windows jobs
      # verify, and running the real executable is what catches a native addon
      # or module-resolution problem that a successful package does not reveal.
      # That is the reason `smoke:packaged` exists in this repo: three startup
      # crashes here once packaged cleanly.
      - name: Build and smoke test the unpacked app
        run: |
          npm run build:unpack
          xvfb-run -a npm run smoke:packaged

      # Provisions ~/.config/knownote/models on a cold cache (node_modules'
      # electron and the build produced by the step above are what it needs).
      # `--eval-prepare` only downloads the pinned model and never touches the
      # database, so this cannot pollute the release in any way. The eval entry
      # still runs the real Electron main process, so it gets a display even
      # for that.
      - name: Prime the pinned embedding model cache
        run: xvfb-run -a node scripts/eval.mjs --prepare

      # AppImage and deb only, and electron-builder is called directly rather
      # than through `npm run build:linux`: the script already passes
      # `--linux`, so appending a second `--linux` with its target list would
      # duplicate the flag. The build output it needs was produced by the
      # step above.
      #
      # The `linux.target` list in electron-builder.yml also contains snap, but
      # building a snap needs snapcraft, which is slow and flaky on CI. Snap is
      # a distribution channel rather than a download artifact, so the release
      # ships the two formats users actually fetch; `npm run build:linux`
      # still builds all three locally.
      #
      # The publish target is overridden for the same reason as the other two
      # platforms: the configuration names the upstream repository, and a fork's
      # token has no write access to it.
      - name: Build & Release (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --linux AppImage deb
          --config.publish.owner="${{ env.PUBLISH_OWNER }}"
          --config.publish.repo="${{ env.PUBLISH_REPO }}"
          --publish always

      # The artifact users actually download on Linux is this AppImage, not the
      # unpacked build above - and the one code path that differs between the
      # two is the embedding worker thread, whose entry inside app.asar once
      # turned every model lookup into `Not Found` while the unpacked smoke test
      # stayed green (docs/appimage-embedding-indexing-bug.md). This runs the
      # smoke test against the AppImage's own contents, including the
      # worker-thread embedding check, and fails this job when that breaks
      # - a failing gate has to hold the artifact it vetoes.
      - name: Smoke test the AppImage artifact
        run: xvfb-run -a npm run smoke:appimage
        env:
          SMOKE_MODEL_CACHE: ~/.config/knownote/models

  # electron-builder uploads into the draft created by `create-draft` (see
  # publish.releaseType in electron-builder.yml, and the note on that job for
  # why the draft is created up front). It is promoted to public here, which
  # happens only if every platform built and the macOS artifact verification
  # passed. A broken package therefore never reaches users - it stays a draft.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # A Linux build that failed leaves the release without Linux artifacts.
      # That is a supported state - the Linux job does not gate promotion - so
      # it is reported as a warning rather than an error, and every missing
      # format is named so the gap is never silent.
      - name: Report missing platform artifacts
        run: |
          set -uo pipefail
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ -z "$ASSETS" ]; then
            echo "::warning title=Could not list release assets::skipping the platform artifact check"
          else
            MISSING=0
            for ext in exe dmg deb AppImage; do
              found=0
              while IFS= read -r name; do
                case "$name" in
                  *".$ext") found=1; break ;;
                esac
              done <<< "$ASSETS"
              if [ "$found" = "0" ]; then
                echo "::warning title=Missing release artifact::no asset ends with '.$ext' in release $GITHUB_REF_NAME"
                MISSING=1
              fi
            done
            if [ "$MISSING" = "1" ]; then
              echo "::notice title=Incomplete release::one or more platforms did not publish an artifact; see the failing job in this run."
            fi
          fi

      - name: Promote draft release to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx true || {
            echo "::error::no draft release found for $GITHUB_REF_NAME"; exit 1; }

          # Release notes are generated from the labels on the merged PRs, per
          # .github/release.yml. `gh release edit` has no --generate-notes, so
          # the API endpoint is used and its body written back to the draft.
          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq '.body')
          if [ -z "$NOTES" ]; then
            echo "::error::generated release notes for $GITHUB_REF_NAME are empty"
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes "$NOTES" --draft=false --latest
          echo "::notice title=Published::Released $GITHUB_REF_NAME"
